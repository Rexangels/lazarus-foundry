[pytest]
DJANGO_SETTINGS_MODULE = config.settings
pythonpath = .
testpaths = tests
python_files = test_*.py
# pytest's defaults plus generated Git fixtures, whose own tests/ must never be
# collected as ours (some of them fail on purpose).
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} lazarus_fixtures lazarus_workspaces paypulse_dead_repo
addopts = -ra --strict-markers
markers =
    slow: builds Git repositories or runs subprocess pytest; excluded from the save hook's fast run (-m "not slow")
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
