services:
  db:
    image: pgvector/pgvector:pg16
    container_name: lazarus_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lazarus}
      POSTGRES_USER: ${POSTGRES_USER:-lazarus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lazarus_secret}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lazarus"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lazarus_redis
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  pgdata:
